<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>留声</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Ink-on-paper palette — warm, editorial */
      --bg: #f8f6f2;
      --bg-secondary: #f0ede7;
      --card: #fffef9;
      --card-hover: #f5f2ec;
      --border: #e2ddd4;
      --border-subtle: #ebe7e0;

      /* Text — warm ink tones, NOT pure black */
      --text: #2c2520;
      --text-secondary: #6b5f54;
      --muted: #9c8f82;

      /* Primary accent — deep warm coral, NOT teal/indigo */
      --accent: #c05d3b;
      --accent-hover: #a84e30;
      --accent-light: rgba(192, 93, 59, 0.07);
      --accent-glow: rgba(192, 93, 59, 0.2);
      --border-focus: #c05d3b;

      /* Semantic */
      --green: #4a8c6f;
      --green-light: #eef6f1;
      --red: #c44040;
      --red-light: #fdf0f0;

      /* Legacy aliases (JS compatibility) */
      --blue: var(--accent);
      --blue-light: var(--accent-light);
      --green-surface: var(--accent-light);
      --cyan: var(--accent);
      --lime: var(--accent);

      /* Motion — exponential easing for natural deceleration */
      --duration-fast: 120ms;
      --duration-default: 200ms;
      --duration-slow: 320ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    :focus:not(:focus-visible) { outline: none; }
    * { touch-action: manipulation; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .layout { display: flex; height: 100vh; }

    /* ────── Sidebar ────── */
    .sidebar {
      width: 260px; background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header { padding: 20px 20px 16px; }
    .sidebar-header h2 {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
      color: var(--text);
    }
    .sidebar-header p { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: 0.02em; }
    .history-list { flex: 1; overflow-y: auto; padding: 8px; }
    .history-item {
      padding: 10px 12px; border-radius: 6px; cursor: pointer;
      margin-bottom: 2px; position: relative;
      transition: background var(--duration-fast) var(--ease-out);
    }
    .history-item:hover { background: var(--accent-light); }
    .history-item.active { background: var(--accent-light); }
    .history-item .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 24px; }
    .history-item .meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; letter-spacing: 0.02em; }
    .history-item.active .meta { color: var(--text-secondary); }
    .history-item .delete-btn {
      position: absolute; top: 50%; right: 4px; transform: translateY(-50%);
      width: 32px; height: 32px; border: none; border-radius: 6px;
      background: transparent; color: var(--muted); font-size: 14px;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      transition: background var(--duration-fast) var(--ease-out);
    }
    .history-item:hover .delete-btn { display: flex; }
    .history-item .delete-btn:hover { background: var(--red); color: #fffef9; }
    .clear-all-btn {
      background: none; border: 1px solid var(--border); color: var(--muted); font-size: 12px;
      cursor: pointer; padding: 8px 12px; margin: 8px 20px 0; border-radius: 6px;
      min-height: 36px; letter-spacing: 0.02em;
      transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out);
    }
    .clear-all-btn:hover { color: var(--red); border-color: var(--red); }
    .history-empty { padding: 32px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }

    /* 转录队列状态：在看别的结果时，点它回到进度页 */
    .queue-status {
      display: flex; align-items: center; gap: 8px;
      margin: 0 8px 4px; padding: 9px 12px; min-height: 36px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card);
      font: inherit; font-size: 12px; color: var(--text-secondary); text-align: left; cursor: pointer;
      transition: border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
    }
    .queue-status:hover { border-color: var(--accent); color: var(--accent); }
    .queue-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .queue-status.is-running .queue-status-dot { background: var(--accent); animation: queue-pulse 1.6s ease-in-out infinite; }
    .queue-status-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @keyframes queue-pulse { 50% { opacity: 0.3; } }

    /* ────── Header ────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header {
      padding: 12px 28px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: 0.02em;
    }
    .header-badge {
      background: var(--bg-secondary); color: var(--muted);
      padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
      border: 1px solid var(--border);
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .header-btn {
      padding: 5px 14px; min-height: 30px;
      border: 1px solid var(--border); border-radius: 20px;
      background: transparent; color: var(--muted);
      font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
      cursor: pointer;
      transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out);
    }
    .header-btn:hover { border-color: var(--accent); color: var(--accent); }
    .header-btn:active { transform: scale(0.97); }

    /* 纠错词表面板 */
    .corr-modal { max-width: 560px; text-align: left; }
    .corr-quick { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .corr-quick input {
      flex: 1; min-width: 0; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
      font: inherit; font-size: 13px; outline: none;
      transition: border-color var(--duration-fast) var(--ease-out);
    }
    .corr-quick input:focus { border-color: var(--accent); }
    .corr-quick .corr-arrow { color: var(--muted); flex-shrink: 0; }
    .corr-quick .toolbar-btn { flex-shrink: 0; }
    #corrText {
      width: 100%; box-sizing: border-box; min-height: 220px; padding: 12px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; line-height: 1.8; resize: vertical; outline: none;
    }
    #corrText:focus { border-color: var(--accent); }
    .corr-status { min-height: 20px; font-size: 12px; line-height: 1.6; margin: 8px 0 14px; color: var(--muted); }
    .corr-status.ok { color: var(--green); }
    .corr-status.warn { color: var(--red); }

    /* ────── Footer ────── */
    .tech-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(248,246,242,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
      padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px));
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
      font-size: 10px; color: var(--muted); z-index: 5; letter-spacing: 0.03em;
    }
    .tech-footer span { display: inline-flex; align-items: center; gap: 3px; }
    .tech-footer .tech-label { font-weight: 500; color: var(--text-secondary); }
    .content { flex: 1; overflow-y: auto; padding: 32px; }

    /* ────── Landing ────── */
    .landing { max-width: 560px; margin: 0 auto; text-align: center; position: relative; padding-top: 14vh; }
    .landing-blobs { display: none; }
    .slogan {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 14px; font-weight: 400; letter-spacing: 0.2em;
      color: var(--muted); margin-bottom: 32px; opacity: 0.7;
    }

    /* ────── Drop zone — 首页主角：把录音拖进来 ────── */
    .drop-zone {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 280px; padding: 40px 32px;
      background: var(--card);
      border: 1.5px dashed var(--border); border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(44,37,32,0.04), 0 16px 40px -20px rgba(44,37,32,0.14);
      transition: border-color var(--duration-default) var(--ease-out),
                  box-shadow var(--duration-slow) var(--ease-out),
                  transform var(--duration-slow) var(--ease-out);
    }
    .drop-zone::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: var(--accent-light); opacity: 0; pointer-events: none;
      transition: opacity var(--duration-default) var(--ease-out);
    }
    .drop-zone:hover { border-color: var(--accent); box-shadow: 0 1px 2px rgba(44,37,32,0.04), 0 20px 48px -20px var(--accent-glow); }
    .drop-zone:active { transform: scale(0.99); }
    .drop-zone:focus-visible { outline-offset: 4px; }
    body.is-dragging .drop-zone {
      border-style: solid; border-color: var(--accent);
      transform: scale(1.015);
      box-shadow: 0 0 0 6px var(--accent-light), 0 28px 60px -20px rgba(192,93,59,0.4);
    }
    body.is-dragging .drop-zone::before { opacity: 1; }

    /* 声波：平时慢慢呼吸（接替原来麦克风的呼吸），悬停 / 拖进来时跳起来 */
    .drop-wave { width: 64px; height: 40px; margin-bottom: 22px; fill: var(--accent); overflow: visible; }
    .drop-wave rect { transform-box: fill-box; transform-origin: center; animation: wave-breathe 4s ease-in-out infinite; }
    .drop-wave rect:nth-child(1), .drop-wave rect:nth-child(5) { opacity: 0.4; }
    .drop-wave rect:nth-child(2), .drop-wave rect:nth-child(4) { opacity: 0.7; }
    .drop-wave rect:nth-child(2) { animation-delay: -0.4s; }
    .drop-wave rect:nth-child(3) { animation-delay: -0.8s; }
    .drop-wave rect:nth-child(4) { animation-delay: -1.2s; }
    .drop-wave rect:nth-child(5) { animation-delay: -1.6s; }
    .drop-zone:hover .drop-wave rect,
    body.is-dragging .drop-wave rect { animation-name: wave-live; animation-duration: 0.9s; }
    @keyframes wave-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.7); } }
    @keyframes wave-live { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }

    .drop-title {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 24px; font-weight: 600; color: var(--text); letter-spacing: 0.02em;
    }
    .drop-release { display: none; color: var(--accent); }
    body.is-dragging .drop-zone .drop-title { display: none; }
    body.is-dragging .drop-zone .drop-release { display: block; }
    .drop-hint { font-size: 13px; color: var(--text-secondary); margin-top: 10px; letter-spacing: 0.02em; }


    /* Voice Memo Guide (iPhone) */
    .voice-memo-guide { margin-top: 20px; }
    .vm-flow { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .vm-flow-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; text-align: center;
      flex: 1; max-width: 150px;
    }
    .vm-flow-item.active {
      border-color: var(--accent); background: var(--accent-light);
    }
    .vm-flow-icon { font-size: 28px; margin-bottom: 6px; }
    .vm-flow-text { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
    .vm-flow-text span { font-weight: 400; color: var(--muted); font-size: 11px; }
    .vm-flow-arrow { font-size: 20px; color: var(--accent); font-weight: 700; flex-shrink: 0; }

    /* 不在首页时（看结果、转录中）拖文件进来：整窗遮罩 */
    .drag-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(248,246,242,0.9);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 2px dashed var(--accent);
      border-radius: 16px; margin: 20px; padding: 24px;
      justify-content: center; align-items: center; text-align: center;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 20px; font-weight: 600; color: var(--accent);
    }
    .drag-overlay.show { display: flex; }

    input[type="file"] { display: none; }

    /* ────── Modal ────── */
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(44,37,32,0.4); justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border-radius: 14px; padding: 32px;
      max-width: 380px; width: 90%; text-align: center;
      box-shadow: 0 24px 80px rgba(44,37,32,0.2);
    }
    .modal-icon { font-size: 48px; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
    .modal-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 24px; }
    .modal-btn {
      display: block; width: 100%; padding: 13px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
      transition: background var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
    }
    .modal-btn:active { transform: scale(0.98); }
    .modal-btn.primary { background: var(--accent); color: #fffef9; }
    .modal-btn.primary:hover { background: var(--accent-hover); }
    .modal-btn.secondary { background: var(--bg-secondary); color: var(--text); }
    .modal-btn.secondary:hover { background: var(--border); }

    /* ────── Progress ────── */
    .progress-area { max-width: 520px; margin: 48px auto; display: none; }
    .progress-area.show { display: block; }
    .progress-file { font-size: 14px; font-weight: 500; margin-bottom: 16px; color: var(--text-secondary); }
    .progress-bar-wrap { background: var(--border); border-radius: 4px; height: 4px; overflow: visible; margin-bottom: 32px; position: relative; }
    .progress-bar {
      height: 100%; border-radius: 4px; width: 0%;
      background: var(--accent);
      transition: width 0.8s var(--ease-in-out);
      position: relative;
    }
    .progress-bar.done { background: var(--green); }

    .walker { position: absolute; top: -26px; right: -10px; font-size: 20px; transition: right 0.3s var(--ease-out); filter: drop-shadow(0 1px 2px rgba(44,37,32,0.15)); }

    .witty-msg { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); min-height: 22px; }

    .progress-steps { display: flex; flex-direction: column; gap: 8px; }
    .step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
    .step.active { color: var(--accent); }
    .step.done { color: var(--green); }
    .step.error { color: var(--red); }
    .step-icon { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ────── 多个文件排队：进度页下面的列表 ────── */
    .batch-list { list-style: none; margin-top: 28px; border-top: 1px solid var(--border-subtle); }
    .batch-item { border-bottom: 1px solid var(--border-subtle); }
    .batch-row {
      display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 10px;
      width: 100%; padding: 10px 8px; border: none; background: none; border-radius: 6px;
      font: inherit; font-size: 13px; text-align: left; color: var(--text-secondary);
    }
    button.batch-row { cursor: pointer; transition: background-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out); }
    button.batch-row:hover { background: var(--accent-light); color: var(--text); }
    button.batch-row:hover .batch-meta { color: var(--accent); }
    .batch-icon { display: inline-flex; justify-content: center; color: var(--muted); }
    .batch-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .batch-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .batch-item.is-active .batch-name { color: var(--text); font-weight: 500; }
    .batch-item.is-active .batch-meta { color: var(--accent); }
    .batch-item.is-done .batch-icon { color: var(--green); }
    .batch-item.is-error .batch-icon,
    .batch-item.is-error .batch-meta { color: var(--red); }
    .batch-item.is-error .batch-meta { grid-column: 2 / -1; white-space: normal; margin-top: 2px; }
    .batch-item.is-canceled { opacity: 0.55; }
    /* 整批转完：收起单个文件的进度，只留总结和列表 */
    .progress-area.batch-finished .progress-bar-wrap,
    .progress-area.batch-finished .progress-steps,
    .progress-area.batch-finished #progressPercent,
    .progress-area.batch-finished #progressEta { display: none !important; }
    .progress-area.batch-finished .progress-file {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 20px; font-weight: 600; color: var(--text); text-align: center; margin-bottom: 4px;
    }
    .progress-actions { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }

    /* 轻提示：跳过了哪些文件、加进队列没有 */
    .toast {
      position: fixed; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 400;
      width: max-content; max-width: min(480px, calc(100vw - 32px));
      padding: 10px 18px; border-radius: 10px;
      background: var(--text); color: var(--card); font-size: 13px; line-height: 1.6; text-align: center;
      box-shadow: 0 12px 32px rgba(44,37,32,0.22);
      opacity: 0; pointer-events: none; transform: translate(-50%, 8px);
      transition: opacity var(--duration-slow) var(--ease-out), transform var(--duration-slow) var(--ease-out);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ────── Results ────── */
    .results { display: none; max-width: 760px; margin: 0 auto; }
    .results.show { display: block; }

    .results-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .toolbar-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      color: var(--text); letter-spacing: 0.02em;
      transition: border-color var(--duration-fast) var(--ease-out),
                  color var(--duration-fast) var(--ease-out),
                  background var(--duration-fast) var(--ease-out);
    }
    .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar-btn:active { transform: scale(0.98); }
    .toolbar-btn.primary { background: var(--accent); color: #fffef9; border-color: var(--accent); }
    .toolbar-btn.primary:hover { background: var(--accent-hover); }
    .toolbar-btn.copied { background: var(--green); color: #fffef9; border-color: var(--green); }
    .toolbar-btn svg { width: 15px; height: 15px; fill: currentColor; }
    .toolbar-spacer { flex: 1; }

    .result-stats { display: flex; gap: 12px; margin-bottom: 16px; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
    .result-stats span { background: var(--bg-secondary); padding: 4px 12px; border-radius: 4px; }

    /* Tab switcher */
    .tab-bar {
      display: inline-flex; gap: 0; margin-bottom: 20px;
      border-bottom: 1px solid var(--border); padding: 0;
      background: transparent; border-radius: 0;
    }
    .tab-btn {
      padding: 10px 20px; text-align: center; font-size: 14px; font-weight: 500;
      border: none; background: transparent; cursor: pointer;
      color: var(--muted); letter-spacing: 0.02em;
      border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 0;

const dropZone = document.getElementById('dropZone');

// IndexedDB 录音备份：旧版网页录音留下的（录音功能 v1.3.0 已去掉），只读不再写；
// checkBackup 在启动时把升级前被中断的录音救回来
const DB_NAME = 'kaihui-backup';
const DB_STORE = 'recording';
function openBackupDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function loadBackupFromDB() {
  try {
    const db = await openBackupDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get('current');
      req.onsuccess = () => { db.close(); resolve(req.result || null); };
      req.onerror = () => { db.close(); resolve(null); };
    });
  } catch (e) { return null; }
}
async function clearBackupDB() {
  try {
    const db = await openBackupDB();
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete('current');
    db.close();
  } catch (e) {}
}

// Witty messages

function startWittyMessages() {
  const el = document.getElementById('wittyMsg');
  // 个人版不出纪要，讲纪要的那几句不播
  const messages = transcriptOnly ? wittyMessages.filter(m => !m.includes('纪要')) : wittyMessages;
  let idx = Math.floor(Math.random() * messages.length);
  const show = () => {
    el.textContent = messages[idx];
    idx = (idx + 1) % messages.length;
  };
  show();
  clearInterval(wittyTimer);   // 上一轮没停也不会留下两个定时器
  wittyTimer = setInterval(show, 5000);
}

function stopWittyMessages(msg) {
  clearInterval(wittyTimer);
  wittyTimer = null;
  const el = document.getElementById('wittyMsg');
  el.textContent = msg || '';
}

// ────── Step 管理 ──────
function setStepIcon(iconEl, status) {
  iconEl.textContent = '';
  if (status === 'active') {
    const s = document.createElement('span');
    s.className = 'spinner';
    iconEl.appendChild(s);
  } else {
    iconEl.textContent = status === 'done' ? '✓' : '✗';
  }
}
function addStep(msg, status) {
  const el = document.createElement('div');
  el.className = `step ${status}`;
  const icon = document.createElement('span');
  icon.className = 'step-icon';
  setStepIcon(icon, status);
  const text = document.createElement('span');
  text.className = 'step-text';
  text.textContent = msg;
  el.appendChild(icon);
  el.appendChild(text);
  steps.push(el);
  progressSteps.appendChild(el);
  return steps.length - 1;
}
function updateStep(idx, msg, status) {
  if (idx < 0 || idx >= steps.length) return;
  steps[idx].className = `step ${status}`;
  setStepIcon(steps[idx].querySelector('.step-icon'), status);
  steps[idx].querySelector('.step-text').textContent = msg;
}

let crawlValue = 0;
function startCrawl(from, to) {
  crawlValue = from;
  progressBar.style.width = from + '%';
  clearInterval(crawlTimer);
  crawlTimer = setInterval(() => {
    crawlValue += (to - crawlValue) * 0.02;
    if (crawlValue >= to - 0.1) crawlValue = to - 0.1;
    progressBar.style.width = crawlValue + '%';
  }, 300);
}
function stopCrawl(snapTo) {
  clearInterval(crawlTimer);
  crawlTimer = null;
  if (snapTo != null) { crawlValue = snapTo; progressBar.style.width = snapTo + '%'; }
}

// ────── 进度系统 ──────
// 用户看到的是：百分比 + 预计剩余时间，从 0% 到 100%
let progressTotalSec = 0;
let progressStartTime = 0;
let progressPhase = '';
let progressTimer = null;
let progressEstimatedTotal = 0; // 预估总时长（会被实测数据更新）

function setProgress(percent) {
  progressBar.style.width = Math.min(percent, 100) + '%';
  const pctEl = document.getElementById('progressPercent');
  if (pctEl) pctEl.textContent = Math.round(percent) + '%';
}

function formatEta(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s <= 0) return '即将完成...';
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return '预计剩余 ' + (m > 0 ? `${m}分${String(sec).padStart(2,'0')}秒` : `${sec}秒`);
}

// 启动进度条：从 0% 匀速到 95%，显示基于预估的剩余时间
function startProgressTimer(estimatedSec) {
  progressEstimatedTotal = estimatedSec;
  progressStartTime = Date.now();
  const pctEl = document.getElementById('progressPercent');
  const etaEl = document.getElementById('progressEta');
  if (pctEl) pctEl.style.display = '';
  if (etaEl) { etaEl.style.display = ''; etaEl.textContent = formatEta(estimatedSec); }

  if (progressTimer) clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    const elapsed = (Date.now() - progressStartTime) / 1000;
    const est = progressEstimatedTotal;
    // 百分比：线性映射到 0→95%，超时后缓慢爬升
    let pct;
    if (elapsed <= est) {
      pct = (elapsed / est) * 95;
    } else {
      // 超时：继续爬升，每多10秒+1%，不会感觉卡住
      pct = 95 + (1 - 1 / (1 + (elapsed - est) / 10)) * 4; // 最多到 99%
    }
    setProgress(pct);

    // 剩余时间
    const remaining = est - elapsed;
    if (etaEl) etaEl.textContent = formatEta(remaining);
  }, 1000);
}

// 用实测数据更新预估总时长（不重启 timer，只调整速度）
function recalibrateProgress(newEstimatedTotal) {
  progressEstimatedTotal = newEstimatedTotal;
}

function stopProgressTimer(finalPct) {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  if (finalPct != null) setProgress(finalPct);
  const etaEl = document.getElementById('progressEta');
  if (etaEl) etaEl.style.display = 'none';
}

// 快速加一行：这个正词已经有行了就把新错写并进去（一个正词一行），没有才新起一行
function corrQuickAdd() {
  const wrongEl = document.getElementById('corrWrong');
  const rightEl = document.getElementById('corrRight');
  const wrong = wrongEl.value.trim();
  const right = rightEl.value.trim();
  const status = document.getElementById('corrStatus');
  status.className = 'corr-status';
  if (!wrong || !right) { status.textContent = '「认错的词」和「应该是」都要填'; return; }

// ────── 转录队列 ──────
// 拖进来的录音（可以多个、可以整个文件夹）排成一队，转完一个再转下一个——whisper 本来也一次只跑一个
const AUDIO_EXTS = ['.m4a', '.mp3', '.mp4', '.wav', '.aac', '.ogg', '.webm', '.caf', '.flac'];  // 和 server.js 的 fileFilter 一致
const MAX_UPLOAD_MB = 500;   // 和 server.js 的上传上限一致
let batch = null;            // { items: [{ file, key, status, id, duration, charCount, error }], running }
let batchGen = 0;            // 每开一批 +1：上一批延迟打开结果前核对一下，别把新一批的进度页换掉
let progressFileText = '';   // 进度页上当前文件的名字和大小；队列变了，前面的「第几个」跟着刷新
// 从旧录音备份恢复出来的文件：只有它转成功了才清 IndexedDB 里的备份。
// 普通上传不能清——恢复提示可能还没回答，被拖进来的文件一挡，备份就没了
const backupFiles = new WeakSet();

const fileKey = f => `${f.name}|${f.size}|${f.lastModified}`;
const isAudioName = name => AUDIO_EXTS.some(ext => name.toLowerCase().endsWith(ext));
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const sidebarOpen = () => document.getElementById('sidebar').classList.contains('open');

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), Math.min(12000, 3000 + msg.length * 100));
}

// files 已经过滤好；note 是过滤时攒下的说明（比如「2 个不是支持的录音格式，跳过了」）
function enqueueFiles(files, note = '') {
  const running = !!(batch && batch.running);
  const queued = new Set(running
    ? batch.items.filter(it => it.status === 'waiting' || it.status === 'active').map(it => it.key)
    : []);
  const fresh = files.filter(f => !queued.has(fileKey(f)));
  if (!fresh.length) {
    showToast(files.length ? '这些文件已经在队列里了' : `没有找到录音文件${note ? `（${note}）` : ''}`);
    return;
  }
  if (!running) { batch = { items: [], running: false }; batchGen++; }
  batch.items.push(...fresh.map(file => ({ file, key: fileKey(file), status: 'waiting' })));
  const dup = files.length - fresh.length;
  const notes = [note, dup ? `${dup} 个已经在队列里` : ''].filter(Boolean);
  if (running) showToast([`又加了 ${fresh.length} 个，排在后面`, ...notes].join('；'));
  else if (notes.length) showToast(notes.join('；'));
  renderBatch();
  if (!running) runBatch();
}

async function runBatch() {
  batch.running = true;
  let first = true;
  let item;
  while ((item = batch.items.find(it => it.status === 'waiting'))) {
    item.status = 'active';
    renderBatch();
    // 第一个文件切到进度页；之后用户要是正在看别的结果，就在后台接着转，不把人拽回来
    const reveal = first || progressArea.classList.contains('show');
    first = false;
    const result = await handleFile(item.file, reveal);
    if (result.ok && backupFiles.has(item.file)) clearBackupDB();
    Object.assign(item, result.ok
      ? { status: 'done', id: result.id, duration: result.duration, charCount: result.charCount }
      : { status: 'error', error: result.error });
    renderBatch();
    // 两个之间停一下，让人看清上一个转完了（失败的多停一会儿）
    if (batch.items.some(it => it.status === 'waiting')) await sleep(result.ok ? 1200 : 2500);
  }
  batch.running = false;
  finishBatch();
}

function finishBatch() {
  const items = batch.items;
  const count = status => items.filter(it => it.status === status).length;
  const watching = progressArea.classList.contains('show');
  window.onbeforeunload = null;
  if (items.length === 1) {
    // 单个文件：跟以前一样，转好了直接打开结果；没转成就留在进度页看原因
    const [only] = items;
    if (only.status === 'done') {
      revealResult(only.id, `「${only.file.name}」`);
    } else {
      if (!watching) showToast(`「${only.file.name}」没转成：${only.error}`);
      document.getElementById('backHomeBtn').hidden = false;
    }
  } else {
    // 多个文件：停在列表页，转好的点一下就能看
    const failed = count('error');
    const canceled = count('canceled');
    const summary = failed || canceled
      ? [`${items.length} 个录音：${count('done')} 个转好了`,
         failed ? `${failed} 个失败` : '', canceled ? `${canceled} 个取消了` : ''].filter(Boolean).join('，')
      : `${items.length} 个录音都转好了`;
    document.getElementById('progressFile').textContent = summary;
    progressArea.classList.add('batch-finished');
    stopWittyMessages(failed ? '失败的原因写在文件名下面' : '点文件名查看转录');
    document.getElementById('backHomeBtn').hidden = false;
    if (!watching) showToast(summary);
  }
  renderBatch();
}

function cancelRest() {
  if (!batch) return;
  const hadFocus = document.activeElement === document.getElementById('cancelRestBtn');
  batch.items.forEach(it => { if (it.status === 'waiting') it.status = 'canceled'; });
  renderBatch();
  if (hadFocus) document.getElementById('batchList').focus();   // 按钮点完就藏起来了
}

// 正在转第几个；两个文件之间的空档算刚转完的那个
function batchPosition() {
  const active = batch.items.findIndex(it => it.status === 'active');
  return active >= 0 ? active + 1 : batch.items.filter(it => it.status === 'done' || it.status === 'error').length;
}

function refreshProgressFile() {
  const label = batch && batch.items.length > 1 ? `第 ${batchPosition()} / ${batch.items.length} 个 · ` : '';
  document.getElementById('progressFile').textContent = label + progressFileText;
}

const BATCH_STATUS = { waiting: '等待中', active: '正在转录…', canceled: '已取消' };
const BATCH_ICON = { waiting: '·', active: '', done: '✓', error: '✗', canceled: '–' };

function renderBatchItem(item) {
  const li = document.createElement('li');
  li.className = `batch-item is-${item.status}`;
  // 转好的整行是按钮，点开看结果
  const row = document.createElement(item.status === 'done' ? 'button' : 'div');
  row.className = 'batch-row';
  row.dataset.key = item.key;
  const icon = document.createElement('span');
  icon.className = 'batch-icon';
  icon.setAttribute('aria-hidden', 'true');
  icon.textContent = BATCH_ICON[item.status];
  if (item.status === 'active') {
    const spin = document.createElement('span');
    spin.className = 'spinner';
    icon.appendChild(spin);
  }
  const name = document.createElement('span');
  name.className = 'batch-name';
  name.textContent = item.file.name;
  const meta = document.createElement('span');
  meta.className = 'batch-meta';
  meta.textContent = item.status === 'done'
    ? `${Math.floor(item.duration / 60)}分${item.duration % 60}秒 · ${item.charCount}字`
    : item.status === 'error' ? item.error : BATCH_STATUS[item.status];
  row.append(icon, name, meta);
  if (item.status === 'done') {
    row.type = 'button';
    row.title = '查看这份转录';
    row.addEventListener('click', () => openTranscript(item.id));
  }
  li.appendChild(row);
  return li;
}

function renderBatch() {
  const items = batch ? batch.items : [];
  const running = !!(batch && batch.running);
  const waiting = items.filter(it => it.status === 'waiting').length;
  const list = document.getElementById('batchList');
  // 整个列表重画：焦点要是在某个转好的行上，画完放回那一行，键盘用户不会被丢回页面开头
  const focusedKey = list.contains(document.activeElement) ? document.activeElement.dataset.key : '';
  list.hidden = items.length < 2;
  list.replaceChildren(...(items.length < 2 ? [] : items.map(renderBatchItem)));
  if (focusedKey) [...list.querySelectorAll('button.batch-row')].find(b => b.dataset.key === focusedKey)?.focus();
  const cancelBtn = document.getElementById('cancelRestBtn');
  cancelBtn.hidden = !(running && waiting);
  cancelBtn.textContent = `取消剩下的 ${waiting} 个`;
  if (running) {
    refreshProgressFile();
    // 还有没上传的：关页面 / 刷新就转不了了，提醒一下
    window.onbeforeunload = waiting ? () => '还有录音在排队，离开页面就不会再转了' : null;
  }
  updateQueueStatus(running);
}

// 侧栏顶上的队列状态：在看别的结果时，点它回到进度页
function updateQueueStatus(running) {
  const btn = document.getElementById('queueStatus');
  const items = batch ? batch.items : [];
  btn.hidden = !(running || items.length > 1);
  if (btn.hidden) return;
  btn.classList.toggle('is-running', running);
  const done = items.filter(it => it.status === 'done').length;
  document.getElementById('queueStatusText').textContent = !running
    ? `这批 ${items.length} 个 · ${done} 个转好了`
    : items.length > 1 ? `正在转录第 ${batchPosition()} / ${items.length} 个` : `正在转录「${items[0].file.name}」`;
}

// 转完了：用户还停在进度页就打开结果（等 0.8 秒让人看到「完成」）；正在看别的就只提示一声

// 进度页清空、收起上一批：回首页和开始录音时用。队列还在转就不动（runBatch 还在用 batch）

// ────── 拖放 / 选文件 ──────
// 拖进来的东西先记下来：webkitGetAsEntry 只能在 drop 事件里同步取，await 之后 DataTransfer 就清空了
function snapshotDrop(dt) {
  const items = [...(dt.items || [])].filter(it => it.kind === 'file');
  if (!items.length) return [...dt.files].map(file => ({ file }));
  return items.map(it => {
    const entry = typeof it.webkitGetAsEntry === 'function' ? it.webkitGetAsEntry() : null;
    return entry ? { entry } : { file: it.getAsFile() };
  });
}

// 文件夹递归展开；.DS_Store 之类的隐藏文件不算；读不了的记下来
async function readEntry(entry, found, unreadable) {
  if (entry.name.startsWith('.')) return;
  if (entry.isFile) {
    try {
      found.push(await new Promise((resolve, reject) => entry.file(resolve, reject)));
    } catch (e) {
      console.warn('[drop] 读不了文件', entry.fullPath, e);
      unreadable.push(entry.name);
    }
    return;
  }
  if (!entry.isDirectory) return;
  const reader = entry.createReader();
  for (;;) {   // readEntries 一次最多给 100 个，要读到空为止
    let page;
    try {
      page = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
    } catch (e) {
      console.warn('[drop] 读不了文件夹', entry.fullPath, e);
      unreadable.push(entry.name);
      return;
    }
    if (!page.length) return;
    for (const child of page) await readEntry(child, found, unreadable);
  }
}

// 展开成文件，只留支持的录音格式，按文件名自然排序（录音2 排在 录音10 前面）
async function collectAudioFiles(dropped) {
  const found = [];
  const unreadable = [];
  for (const d of dropped) {
    if (d.entry) await readEntry(d.entry, found, unreadable);
    else if (d.file && !d.file.name.startsWith('.')) found.push(d.file);
  }
  const audio = found.filter(f => isAudioName(f.name));
  const tooBig = audio.filter(f => f.size > MAX_UPLOAD_MB * 1024 * 1024);
  const files = audio.filter(f => !tooBig.includes(f))
    .sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true }));
  const notAudio = found.length - audio.length;
  const note = [
    notAudio ? `${notAudio} 个不是支持的录音格式，跳过了` : '',
    ...tooBig.map(f => `「${f.name}」超过 ${MAX_UPLOAD_MB} MB，跳过了`),
    unreadable.length ? `${unreadable.length} 个读不出来，跳过了` : '',
  ].filter(Boolean).join('；');
  return { files, note };
}

function acceptFiles(dropped) {
  collectAudioFiles(dropped)
    .then(({ files, note }) => enqueueFiles(files, note))
    .catch(err => {
      console.error('[drop] 整理文件失败', err);
      showToast('读取文件出错：' + err.message);
    });
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener('change', () => {
  const picked = [...fileInput.files].map(file => ({ file }));
  fileInput.value = '';   // 清掉，下次再选同一个文件也能触发 change
  if (picked.length) acceptFiles(picked);
});

const dragOverlay = document.getElementById('dragOverlay');
// 进过的元素都记下来，全部离开才算拖出了窗口（Safari 的 dragleave 没有 relatedTarget，靠它判断会闪）
const dragTargets = new Set();
const isFileDrag = e => !!e.dataTransfer && [...e.dataTransfer.types].includes('Files');

// 在首页：拖放区自己亮起来；在别的页面（看结果、转录中）：整窗遮罩
function setDragging(on) {
  const onLanding = uploadSection.style.display !== 'none';
  const hint = batch && batch.running ? '松开鼠标，排到队列后面' : '松开鼠标，开始转录';
  document.body.classList.toggle('is-dragging', on && onLanding);
  dragOverlay.classList.toggle('show', on && !onLanding);
  dragOverlay.textContent = hint;
  document.getElementById('dropRelease').textContent = hint;
}

document.addEventListener('dragenter', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  if (!dragTargets.size) setDragging(true);
  dragTargets.add(e.target);
});
document.addEventListener('dragleave', e => {
  if (!isFileDrag(e)) return;
  dragTargets.delete(e.target);
  // 拖动途中被移出页面的节点收不到 dragleave（比如侧栏列表刷新了），顺手清掉，免得遮罩一直挂着
  dragTargets.forEach(t => { if (!document.documentElement.contains(t)) dragTargets.delete(t); });
  if (!dragTargets.size) setDragging(false);
});
document.addEventListener('dragover', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();   // 不拦的话浏览器会直接打开这个文件
  e.dataTransfer.dropEffect = 'copy';
});
document.addEventListener('drop', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragTargets.clear();
  setDragging(false);
  acceptFiles(snapshotDrop(e.dataTransfer));
});

// Main processing
// 转一个文件：只管进度页，转完打开哪个结果由队列决定（见 finishBatch）。
// reveal=false：用户正在看别的结果，进度页只在后台更新，不把人拽回来。
// 返回 { ok: true, id, duration, charCount } 或 { ok: false, error }
async function handleFile(file, reveal = true) {
  if (reveal) {
    uploadSection.style.display = 'none';
    resultsArea.classList.remove('show');
    progressArea.classList.add('show');
  }
  progressArea.classList.remove('batch-finished');
  document.getElementById('backHomeBtn').hidden = true;
  progressFileText = `${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
  refreshProgressFile();
  document.getElementById('walker').textContent = '🎙️';
  progressSteps.innerHTML = '';
  progressBar.style.width = '0%';
  progressBar.classList.remove('done');
  const _pctEl = document.getElementById('progressPercent');
  const _etaEl = document.getElementById('progressEta');
  _pctEl.style.display = '';
  _pctEl.style.color = 'var(--accent)';
  _pctEl.style.fontSize = '36px';
  _pctEl.textContent = '0%';
  _etaEl.style.display = '';
  _etaEl.textContent = '正在上传文件...';
  progressPhase = '';
  steps.length = 0;

  const uploadIdx = addStep('上传文件中...', 'active');
  startWittyMessages();

  const formData = new FormData();
  formData.append('audio', file);
  let result = null;

  try {
    const response = await fetch('/api/transcribe', { method: 'POST', body: formData });
    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: '上传失败' }));
      throw new Error(err.error || `服务器错误 (${response.status})`);
    }
    updateStep(uploadIdx, '文件上传完成', 'done');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let convertIdx = -1, transcribeIdx = -1, speakerIdx = -1;

    // P1 fix: extracted event handler (reused for buffer residual)
    function handleSSEEvent(ev) {
      if (ev.type === 'progress') {
        switch (ev.step) {
          case 'convert':
            convertIdx = addStep(ev.message, 'active');
            break;
          case 'convert_done': {
            const dur = ev.duration || 0;
            const durStr = dur > 0 ? `${Math.floor(dur/60)}分${dur%60}秒` : '';
            if (convertIdx >= 0) updateStep(convertIdx, `音频就绪${durStr ? '（' + durStr + '）' : ''}`, 'done');
            // 启动统一进度条
            // 实测：2分钟分段，每段26秒，总耗时约 dur×0.22 + 30秒纪要
            if (dur > 0) {
              startProgressTimer(Math.max(60, Math.round(dur * 0.25) + 30));
            } else {
              startProgressTimer(120);
            }
            break;
          }
          case 'transcribe':
            transcribeIdx = addStep('正在语音识别...', 'active');
            break;
          case 'transcribe_segment':
            if (transcribeIdx >= 0) {
              const ts = steps[transcribeIdx].querySelector('.step-text');
              if (ts) ts.textContent = '正在语音识别...';
            }
            // current 表示"正在处理第N段"，已完成 = current - 1
            // 至少完成 1 段后才有实测数据来校准
            if (ev.current > 1 && ev.total && progressStartTime) {
              const completedSegs = ev.current - 1;
              const elapsed = (Date.now() - progressStartTime) / 1000;
              const perSeg = elapsed / completedSegs;
              const remainingSegs = ev.total - completedSegs;
              const newTotal = elapsed + perSeg * remainingSegs + 20;
              recalibrateProgress(newTotal);
            }
            break;
          case 'transcribe_done':
            if (transcribeIdx >= 0) updateStep(transcribeIdx, `语音识别完成（${(ev.transcript||'').length}字）`, 'done');
            break;
          case 'speaker':
            if (speakerIdx < 0) speakerIdx = addStep(ev.message, 'active');
            else updateStep(speakerIdx, ev.message, 'active');
            break;
          case 'speaker_done':
            if (speakerIdx >= 0) updateStep(speakerIdx, ev.message, 'done');
            break;
        }
      } else if (ev.type === 'complete') {
        stopProgressTimer(100);
        progressBar.classList.add('done');
        document.getElementById('walker').textContent = '✅';
        document.getElementById('progressPercent').textContent = '100%';
        document.getElementById('progressPercent').style.color = 'var(--green)';
        stopWittyMessages('搞定！');
        addStep(batch && batch.items.length > 1 ? '这个转好了' : '全部完成！', 'done');
        // 结果不在这里显示：用户可能正在看别的转录，currentTranscript 那些也就不能动
        result = { ok: true, id: ev.id, duration: ev.duration || 0, charCount: ev.charCount || 0 };
        loadHistory();
      } else if (ev.type === 'error') {
        stopProgressTimer(null);
        stopWittyMessages();
        addStep('错误: ' + ev.message, 'error');
        result = { ok: false, error: ev.message };
      }
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try { handleSSEEvent(JSON.parse(line.slice(6))); } catch (e) {}
      }
    }
    // P1 fix: process remaining buffer after stream ends
    if (buffer.trim() && buffer.trim().startsWith('data: ')) {
      try { handleSSEEvent(JSON.parse(buffer.trim().slice(6))); } catch (e) {}
    }
  } catch (err) {
    stopProgressTimer(null);
    stopWittyMessages();
    addStep('网络错误: ' + err.message, 'error');
    result = { ok: false, error: '网络错误: ' + err.message };
  }
  if (!result) {
    // 流结束了却既没有 complete 也没有 error（比如服务中途被关了）
    stopProgressTimer(null);
    stopWittyMessages();
    addStep('连接断了，没收到结果', 'error');
    result = { ok: false, error: '连接断了，没收到结果' };
  }
  return result;
}

// 简单 markdown → HTML 渲染（安全：先转义 HTML）
function renderMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^\*\*(.+?)\*\*$/gm, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- \[ \] (.+)$/gm, '<div style="margin:2px 0">☐ $1</div>')
    .replace(/^- (.+)$/gm, '<div style="margin:2px 0;padding-left:1em">• $1</div>')
    .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">')
    .replace(/^(\d+)\. (.+)$/gm, '<div style="margin:2px 0">$1. $2</div>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function setMinutesContent(text) {
  minutesEditor.innerHTML = renderMarkdown(text);
  // 切换历史/新录音/重新生成时，强制退出"编辑源码"模式，避免显示旧 textarea 内容
  const source = document.getElementById('minutesSource');
  const editBtn = document.getElementById('editToggleBtn');
  if (source && source.style.display !== 'none') {
    source.style.display = 'none';
    minutesEditor.style.display = '';
    if (editBtn) editBtn.textContent = '编辑源码';
  }
}

// P1 fix: safe stats renderer (no innerHTML with user data)
function setResultStats(name, duration, charCount) {
  const el = document.getElementById('resultStats');
  el.innerHTML = '';
  const s1 = document.createElement('span'); s1.textContent = name;
  const s2 = document.createElement('span'); s2.textContent = Math.floor(duration/60) + '分' + (duration%60) + '秒';
  const s3 = document.createElement('span'); s3.textContent = '转录 ' + charCount + '字';
  el.append(s1, s2, s3);
}

// Markdown 双模式：预览（minutesEditor，contenteditable=false）vs 编辑（textarea minutesSource）
// 旧版用 contenteditable + textContent 保存，每次"输入"事件都把渲染后的纯文本写回 currentMinutes，
// 导致 Markdown 格式标记（#、-、---、**）丢失，标题/列表/分隔线被压扁
// 新版：预览不可改，要改就点"编辑源码"进 textarea，编辑 Markdown 原文
const minutesSource = document.getElementById('minutesSource');
function toggleEditMode() {
  const editor = document.getElementById('minutesEditor');
  const btn = document.getElementById('editToggleBtn');
  const inEdit = minutesSource.style.display !== 'none';
  if (!inEdit) {
    // 切到编辑模式：把当前 Markdown 源码灌进 textarea
    minutesSource.value = currentMinutes;
    minutesSource.style.display = '';
    editor.style.display = 'none';
    btn.textContent = '完成编辑';
    minutesSource.focus();
  } else {
    // 切回预览：currentMinutes 已经在 input 监听里实时更新，这里只重渲
    setMinutesContent(currentMinutes);
    minutesSource.style.display = 'none';
    editor.style.display = '';
    btn.textContent = '编辑源码';
  }
}

// Auto-save on edit（textarea 编辑模式才触发；预览模式不可改）
minutesSource.addEventListener('input', () => {
  currentMinutes = minutesSource.value;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!currentId) return;
    try {
      await fetch(`/api/transcript/${currentId}/minutes`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ minutes: currentMinutes }),
      });
      const hint = document.getElementById('saveHint');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 2000);
    } catch (e) {}
  }, 1000);
});

// Copy functions
// 重新生成纪要 — 弹输入框让用户写修改要求
function regenerateMinutes() {
  if (!currentId) return;
  document.getElementById('regenNotes').value = '';
  document.getElementById('regenModal').classList.add('show');
}

async function doRegenerate(notes) {
  document.getElementById('regenModal').classList.remove('show');
  const btn = document.getElementById('regenerateBtn');
  btn.disabled = true;
  btn.textContent = '正在重新生成...';

  switchResultTab('minutes');
  currentMinutes = '';
  minutesEditor.innerHTML = '';
  minutesEditor.classList.add('streaming');

  try {
    const response = await fetch(`/api/transcript/${currentId}/regenerate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes }),
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: '请求失败' }));
      throw new Error(err.error || `服务器错误 (${response.status})`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'minutes_chunk') {
            currentMinutes += ev.content;
            setMinutesContent(currentMinutes);
            minutesEditor.scrollTop = minutesEditor.scrollHeight;
          } else if (ev.type === 'complete') {
            currentMinutes = ev.minutes || currentMinutes;
            setMinutesContent(currentMinutes);
          } else if (ev.type === 'error') {
            throw new Error(ev.message);
          }
        } catch (e) {
          if (e.message && !e.message.includes('JSON')) throw e;
        }
      }
    }
  } catch (err) {
    alert('重新生成失败: ' + err.message);
  } finally {
    minutesEditor.classList.remove('streaming');
    btn.disabled = false;
    btn.textContent = '重新生成纪要';
  }
}

function copyMinutes() {
  const btn = document.getElementById('copyMinutesBtn');
  copyText(currentMinutes, btn, '复制到 Lark 文档');
}

function copyPlainText() {
  const btn = document.getElementById('copyTextBtn');
  // 复制当前视图：显示说话人时复制带 [姓名] 的版本，否则复制纯文字
  const text = (currentSpeakerTranscript && transcriptView === 'speaker') ? currentSpeakerTranscript : currentTranscript;
  copyText(text, btn, '复制纯文本');
}

function copyText(text, btn, originalLabel) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showCopied(btn, originalLabel)).catch(() => fallbackCopy(text, btn, originalLabel));
  } else {
    fallbackCopy(text, btn, originalLabel);
  }
}

function fallbackCopy(text, btn, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showCopied(btn, label);
}

function showCopied(btn, originalLabel) {
  if (btn._copyTimer) return; // 防止双击覆盖
  const origHTML = btn.innerHTML;
  btn.innerHTML = '已复制 ✓';
  btn.classList.add('copied');
  btn._copyTimer = setTimeout(() => { btn.innerHTML = origHTML; btn.classList.remove('copied'); btn._copyTimer = null; }, 2000);
}

function resetUI() {
  // 队列在后台转的时候只切回首页：进度页的状态留着，侧栏还能点回去
  if (!(batch && batch.running)) {
    resetProgressView();
    window.onbeforeunload = null;
  }
  uploadSection.style.display = '';
  progressArea.classList.remove('show');
  resultsArea.classList.remove('show');
  fileInput.value = '';
  currentId = '';
  currentMinutes = '';
  currentTranscript = '';
  currentSpeakerTranscript = '';
}

// P1 fix: mobile sidebar toggle
function toggleMobileSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

// History
// P1 fix: use DOM API instead of innerHTML to prevent XSS
async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const list = await res.json();
    const el = document.getElementById('historyList');
    el.innerHTML = '';
    document.getElementById('clearAllBtn').style.display = list.length ? '' : 'none';
    if (!list.length) { el.innerHTML = '<div class="history-empty">还没有录音<br>把录音拖到右边就能开始</div>'; return; }
    list.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.dataset.id = item.id;
      // 转录队列每转完一个都会刷新列表，正在看的那条要保持选中
      if (item.id === currentId && resultsArea.classList.contains('show')) div.classList.add('active');
      div.addEventListener('click', () => loadTranscript(item.id, div));

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.originalName;
      div.appendChild(name);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const dur = document.createElement('span');
      dur.textContent = Math.floor(item.duration/60) + '分' + (item.duration%60) + '秒';
      const chars = document.createElement('span');
      chars.textContent = item.charCount + '字';
      meta.append(dur, chars);
      if (item.hasMinutes) {
        const badge = document.createElement('span');
        badge.textContent = '📋 有纪要';
        meta.appendChild(badge);
      }
      div.appendChild(meta);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '✕';
      delBtn.title = '删除';
      delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTranscript(item.id); });
      div.appendChild(delBtn);

      el.appendChild(div);
    });
  } catch (e) {}
}

async function deleteTranscript(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  try {
    await fetch(`/api/transcript/${id}`, { method: 'DELETE' });
    loadHistory();
    if (currentId === id) resetUI();
  } catch (e) {}
}

async function clearAllHistory() {
  if (!confirm('确定清除全部历史记录吗？此操作不可撤销。')) return;
  try {
    const res = await fetch('/api/history');
    const list = await res.json();
    await Promise.all(list.map(item => fetch(`/api/transcript/${item.id}`, { method: 'DELETE' })));
    loadHistory();
    resetUI();
  } catch (e) {}
}

async function loadTranscript(id, el) {
  try {
    const res = await fetch(`/api/transcript/${id}`);
    if (!res.ok) {
      showToast(res.status === 404 ? '这条记录已经不在了（记录只保留 24 小时）' : '这条记录打不开');
      loadHistory();
      return;
    }
    const data = await res.json();

    currentId = data.id;
    currentMinutes = data.minutes || '';
    currentTranscript = data.transcript || '';
    currentSpeakerTranscript = data.speakerTranscript || '';
    transcriptView = 'speaker';

    uploadSection.style.display = 'none';
    progressArea.classList.remove('show');
    resultsArea.classList.add('show');

    setResultStats(data.originalName || '', data.duration || 0, data.charCount || 0);

    setMinutesContent(currentMinutes);
    renderTranscript();

    // 有转录文本时显示原始转录 tab，没有时隐藏
    const hasTranscript = !!currentTranscript;
    document.querySelectorAll('.tab-btn')[1].style.display = hasTranscript ? '' : 'none';
    document.getElementById('copyTextBtn').style.display = hasTranscript ? '' : 'none';
    // 有转录文本才能重新生成纪要
    document.getElementById('regenerateBtn').style.display = hasTranscript ? '' : 'none';
    switchResultTab('minutes');

    document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');

    // 手机端点击后自动收起侧边栏
    if (window.innerWidth <= 768 && sidebarOpen()) toggleMobileSidebar();
  } catch (e) {
    console.error('loadTranscript error:', e);
  }
}

loadHistory();
fetchConfig();

// 启动时检查旧版网页录音有没有留下被中断的备份（录音功能已去掉，这个恢复入口留着救数据）
(async function checkBackup() {
  const backup = await loadBackupFromDB();
  if (!backup || !backup.blob || backup.blob.size < 1000 || Date.now() - backup.ts > 24 * 60 * 60 * 1000) {
    if (backup) clearBackupDB();
    return;
  }
  const ext = backup.mimeType.includes('webm') ? 'webm' : 'm4a';
  const sizeMB = (backup.blob.size / 1024 / 1024).toFixed(1);
  const ago = Math.round((Date.now() - backup.ts) / 1000);
  const agoText = ago < 60 ? `${ago}秒前` : `${Math.round(ago/60)}分钟前`;

  const modal = document.getElementById('backupModal');
  document.getElementById('backupDesc').textContent = `${agoText}有一段录音被意外中断（${sizeMB} MB），是否继续处理？`;
  document.getElementById('backupBtn').onclick = () => {
    modal.classList.remove('show');
    const file = new File([backup.blob], `会议录音_${new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' })}.${ext}`, { type: backup.mimeType });
    // 不在这里清备份：转成功了队列才清（失败可重试）
    backupFiles.add(file);
    enqueueFiles([file]);
  };
  document.getElementById('backupDiscardBtn').onclick = () => {
    clearBackupDB();
    modal.classList.remove('show');
  };
  modal.classList.add('show');
})();
